<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Admin | Karang Taruna Gading</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="icon" type="image/png" href="../assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>

  <!-- ============ LOGIN ============ -->
  <section class="login" id="viewLogin" hidden>
    <div class="login-rings" aria-hidden="true"><i></i><i></i><i></i></div>
    <form class="login-card" id="loginForm" novalidate>
      <img class="login-logo" src="../assets/logo-256.png" alt="Logo Karang Taruna Gading" width="88" height="88">
      <h1>Masuk admin</h1>
      <label class="field">
        <span>Email</span>
        <input type="email" name="email" autocomplete="username" required>
      </label>
      <label class="field">
        <span>Kata sandi</span>
        <input type="password" name="pass" autocomplete="current-password" required>
      </label>
      <p class="form-error" id="loginError" role="alert" hidden></p>
      <button class="btn btn-dark btn-block" type="submit">Masuk</button>
      <p class="login-hint" id="demoHint" hidden>Mode demo | admin@gading.id | gading09</p>
      <a class="login-back" href="../index.html">Kembali ke situs</a>
    </form>
  </section>

  <!-- ============ DASHBOARD ============ -->
  <section class="app" id="viewApp" hidden>
    <header class="bar">
      <div class="wrap bar-in">
        <a class="bar-brand" href="../index.html" title="Lihat situs">
          <img src="../assets/logo-256.png" alt="" width="34" height="34">
          <span>Gading <em>Admin</em></span>
        </a>
        <div class="bar-actions">
          <a class="bar-link" href="../index.html" target="_blank" rel="noopener">Lihat situs</a>
          <button class="bar-link" type="button" id="logoutBtn">Keluar</button>
        </div>
      </div>
    </header>

    <div class="demo-note" id="demoNote" hidden>
      <div class="wrap">Mode demo: data tersimpan di browser ini saja. Hubungkan Supabase agar bisa dilihat semua orang.</div>
    </div>

    <main class="wrap main">
      <div class="tabs" role="tablist" aria-label="Jenis konten">
        <button class="tab" type="button" role="tab" data-type="kegiatan" aria-selected="true">Kegiatan</button>
        <button class="tab" type="button" role="tab" data-type="berita" aria-selected="false">Berita</button>
      </div>

      <div class="head">
        <div>
          <h1 id="headTitle">Kegiatan</h1>
          <p class="head-count" id="countText"></p>
        </div>
        <button class="btn btn-dark" type="button" id="addBtn">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
          <span id="addText">Tambah kegiatan</span>
        </button>
      </div>

      <label class="search">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="m12.2 12.2 3.3 3.3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        <input type="search" id="searchInput" placeholder="Cari" aria-label="Cari">
      </label>

      <ul class="rows" id="rows"></ul>
    </main>
  </section>

  <!-- ============ EDITOR (laci) ============ -->
  <div class="drawer-wrap" id="drawer" hidden>
    <div class="drawer-scrim" data-close></div>
    <form class="drawer" id="editForm" novalidate aria-labelledby="editTitle">
      <header class="drawer-head">
        <h2 id="editTitle">Kegiatan baru</h2>
        <button class="icon-btn" type="button" data-close aria-label="Tutup">
          <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5 5 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </header>

      <div class="drawer-body">
        <label class="field">
          <span id="lblJudul">Judul kegiatan</span>
          <input type="text" name="judul" maxlength="160" required placeholder="Contoh: Kerja bakti bersih selokan">
        </label>
        <div class="field-row" id="rowTanggal">
          <label class="field">
            <span>Tanggal</span>
            <input type="date" name="tanggal" required>
          </label>
          <label class="field" id="fieldLokasi">
            <span>Lokasi <small>opsional</small></span>
            <input type="text" name="lokasi" maxlength="120" placeholder="Balai RW 09">
          </label>
        </div>

        <label class="switch" id="fieldSorot" hidden>
          <input type="checkbox" name="sorot">
          <span class="switch-ui" aria-hidden="true"></span>
          <span class="switch-text"><strong>Jadikan sorotan</strong><small>Tampil paling besar di beranda</small></span>
        </label>

        <label class="field">
          <span id="lblDesk">Deskripsi</span>
          <textarea name="deskripsi" rows="7" placeholder="Ceritakan apa yang dikerjakan, siapa yang terlibat, dan hasilnya."></textarea>
        </label>

        <div class="field">
          <span><span id="lblFoto">Foto</span> <small id="photoCount"></small></span>
          <div class="photos" id="photos"></div>
          <label class="drop" id="drop">
            <input type="file" id="fileInput" accept="image/*" multiple>
            <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="3" y="5" width="20" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="9.5" cy="11" r="2" fill="currentColor"/><path d="m5 19 5.5-5 3.5 3 3-2.5L22 19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
            <strong>Pilih foto</strong>
            <span>atau tarik ke sini</span>
          </label>
          <p class="field-help" id="fotoHelp">Foto pertama jadi sampul. Geser untuk mengubah urutan.</p>
        </div>
        <p class="form-error" id="editError" role="alert" hidden></p>
      </div>

      <footer class="drawer-foot">
        <button class="btn btn-ghost" type="button" data-close>Batal</button>
        <button class="btn btn-dark" type="submit" id="saveBtn">Simpan</button>
      </footer>
    </form>
  </div>

  <!-- ============ DIALOG KONFIRMASI ============ -->
  <div class="modal-wrap" id="modal" hidden>
    <div class="modal-scrim" data-no></div>
    <div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalText">
      <h3 id="modalTitle"></h3>
      <p id="modalText"></p>
      <div class="modal-actions">
        <button class="btn btn-ghost" type="button" data-no>Batal</button>
        <button class="btn btn-danger" type="button" data-yes></button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="../js/config.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
